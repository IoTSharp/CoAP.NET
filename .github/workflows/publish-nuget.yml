name: Build and Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate; publishing requires a version tag
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-and-test:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version=$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' CoAP.NET/CoAP.NET.csproj)
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a MAJOR.MINOR.PATCH package version without leading zeros." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${version}"
          for component in "${major}" "${minor}" "${patch}"; do
            if [[ ${#component} -gt 5 ]] || (( 10#${component} > 65534 )); then
              echo "Version components must fit the assembly version range 0..65534." >&2
              exit 1
            fi
          done
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Restore
        run: |
          dotnet restore CoAP.Test/CoAP.Test.csproj
          dotnet restore CoAP.Example/CoAP.ResourceMvc/CoAP.ResourceMvc.csproj

      - name: Build tested libraries and sample
        shell: bash
        run: |
          set -euo pipefail
          for project in CoAP.Test/CoAP.Test.csproj CoAP.Example/CoAP.ResourceMvc/CoAP.ResourceMvc.csproj; do
            dotnet build "${project}" -c Release --no-restore \
              -p:ContinuousIntegrationBuild=true \
              -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}" \
              -p:RepositoryCommit="${GITHUB_SHA}" -p:SourceRevisionId="${GITHUB_SHA}"
          done

      - name: Test
        run: dotnet test CoAP.Test/CoAP.Test.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=coap.trx" --results-directory "${RUNNER_TEMP}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coap-net-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: warn

      - name: Pack the tested build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nupkg"
          for project in CoAP.NET/CoAP.NET.csproj CoAP.NET.AspNetCore/CoAP.NET.AspNetCore.csproj CoAP.NET.SourceGeneration/CoAP.NET.SourceGeneration.csproj; do
            dotnet pack "${project}" -c Release --no-build --no-restore \
              --output "${RUNNER_TEMP}/nupkg" -p:ContinuousIntegrationBuild=true \
              -p:Version="${PACKAGE_VERSION}" -p:PackageVersion="${PACKAGE_VERSION}" \
              -p:RepositoryCommit="${GITHUB_SHA}" -p:SourceRevisionId="${GITHUB_SHA}"
          done

      - name: Upload tested packages
        uses: actions/upload-artifact@v7
        with:
          name: coap-net-nuget-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/nupkg/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish tested packages
    needs: build-and-test
    if: needs.build-and-test.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download tested packages
        uses: actions/download-artifact@v7
        with:
          name: coap-net-nuget-${{ needs.build-and-test.outputs.version }}
          path: ${{ runner.temp }}/nupkg

      - name: Publish exact package set
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY is required to publish CoAP.NET packages to NuGet.org." >&2
            exit 1
          fi
          for package_id in IoTSharp.CoAP.NET IoTSharp.CoAP.NET.AspNetCore IoTSharp.CoAP.NET.SourceGeneration; do
            package="${RUNNER_TEMP}/nupkg/${package_id}.${PACKAGE_VERSION}.nupkg"
            test -f "${package}"
            dotnet nuget push "${package}" --api-key "${NUGET_API_KEY}" --source "${NUGET_SOURCE}" --timeout 120
          done
